name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install coverage (CI only; the project has no dependencies)
        run: python -m pip install coverage
      - name: Unit, security and end-to-end tests (with coverage)
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report
          python -m coverage xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check browser and extension scripts
        run: |
          node --check app.js
          node --check extension/content.js
          node --check extension/background.js
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json'))"
          node -e "JSON.parse(require('fs').readFileSync('site.webmanifest'))"
